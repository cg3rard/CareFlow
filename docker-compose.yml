# Default development compose file with live-reload for backend and frontend.
# Usage:
#   docker compose up --build
#
# For production, use: docker compose -f docker-compose.prod.yml up --build
#
# Backend: Air watches .go files and rebuilds/restarts automatically.
# Frontend: Vite dev server with HMR (instant browser updates on save).
services:
  postgres:
    image: postgres:16.6-alpine
    container_name: careflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: change_me_before_production
    ports:
      - "5432:5432"
    volumes:
      - careflow_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: careflow-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: development
      DATABASE_URL: postgres://careflow:change_me_before_production@postgres:5432/careflow?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:5173
      DEMO_NAME: Careflow Demo
      DEMO_EMAIL: demo@careflow.local
      DEMO_PASSWORD: CareflowDemo2026!
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - careflow_backend_dev_tmp:/app/tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: careflow-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - careflow_frontend_dev_node_modules:/app/node_modules

volumes:
  careflow_postgres_dev_data:
  careflow_backend_dev_tmp:
  careflow_frontend_dev_node_modules:
